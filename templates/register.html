<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register · Personal Expense Tracker</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head><body class="auth-bg"><main class="auth-card wide"><div class="brand">₹</div><h1>Create your account</h1><p class="muted">Every new account starts with completely empty financial data.</p><form id="registerForm"><label>Full Name<input id="name" required minlength="2"></label><label>Username<input id="username" required minlength="3" maxlength="30" pattern="[A-Za-z0-9_]+"></label><label>Email<input id="email" type="email" required></label><label>Password<input id="password" type="password" minlength="8" required></label><label>Confirm Password<input id="confirm" type="password" minlength="8" required></label><button class="btn primary" type="submit">Create account</button><p id="msg" class="message"></p></form><div class="auth-links"><a href="/login">Already have an account? Sign in</a></div></main><script src="{{ url_for('static',filename='auth.js') }}"></script></body></html>
